# Builds gemx_worker/ into ghcr.io/<owner>/gemx-worker on every push that
# touches it. The image holds no model, no person detector, no body data and no
# sample film (the worker fetches those onto the network volume itself), so it
# can be public. It runs one model, NVIDIA GEM-X: motion from a video.
name: gemx worker image

on:
  push:
    paths: ["gemx_worker/**", ".github/workflows/gemx-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gemx-worker" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: gemx_worker
          platforms: linux/amd64
          push: true
          # Every build is tagged with its commit. Only main moves `latest`,
          # so a branch can build an image to try without changing what
          # `latest` means.
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.image.outputs.name) || '' }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max
